<!DOCTYPE html>

<html class="dark" lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Registro Detallado de Ejercicio</title>
<!-- Fonts and Icons -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#13ec80",
                        "background-light": "#f6f8f7",
                        "background-dark": "#102219",
                        "surface-dark": "#1c3026",
                        "surface-light": "#ffffff",
                    },
                    fontFamily: {
                        "display": ["Lexend", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        /* Custom scrollbar hiding for clean mobile look */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        
        /* Checkbox custom style */
        .checkbox-wrapper input:checked + div {
            background-color: #13ec80;
            border-color: #13ec80;
        }
        .checkbox-wrapper input:checked + div span {
            opacity: 1;
            color: #102219;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display antialiased min-h-screen flex flex-col overflow-hidden text-slate-900 dark:text-white selection:bg-primary selection:text-background-dark">
<!-- Top App Bar -->
<header class="flex items-center justify-between p-4 pb-2 bg-background-light dark:bg-background-dark sticky top-0 z-10">
<button class="flex size-10 items-center justify-center rounded-full hover:bg-black/5 dark:hover:bg-white/10 transition-colors">
<span class="material-symbols-outlined text-2xl">arrow_back</span>
</button>
<div class="flex flex-col items-center">
<h1 class="text-lg font-bold leading-tight tracking-tight">Press de Banca</h1>
<span class="text-xs font-medium text-slate-500 dark:text-slate-400 flex items-center gap-1">
<span class="material-symbols-outlined text-[14px]">fitness_center</span> Pecho
            </span>
</div>
<button class="flex size-10 items-center justify-center rounded-full hover:bg-black/5 dark:hover:bg-white/10 transition-colors text-primary">
<span class="material-symbols-outlined text-2xl">monitoring</span>
</button>
</header>
<!-- Scrollable Content Area -->
<main class="flex-1 overflow-y-auto no-scrollbar pb-32">
<!-- Stats Summary -->
<div class="px-4 py-2">
<div class="flex justify-between items-center bg-surface-light dark:bg-surface-dark rounded-xl p-3 shadow-sm border border-slate-200 dark:border-slate-800">
<div class="flex flex-col items-center flex-1 border-r border-slate-200 dark:border-slate-700">
<span class="text-xs text-slate-500 dark:text-slate-400">1RM Estimado</span>
<span class="font-bold text-primary">100 kg</span>
</div>
<div class="flex flex-col items-center flex-1 border-r border-slate-200 dark:border-slate-700">
<span class="text-xs text-slate-500 dark:text-slate-400">Volumen</span>
<span class="font-bold text-slate-900 dark:text-white">1,200 kg</span>
</div>
<div class="flex flex-col items-center flex-1">
<span class="text-xs text-slate-500 dark:text-slate-400">Mejor Set</span>
<span class="font-bold text-slate-900 dark:text-white">80kg x 8</span>
</div>
</div>
</div>
<!-- Notes Section -->
<div class="px-4 py-2">
<div class="relative">
<textarea class="w-full bg-transparent border-b border-slate-300 dark:border-slate-700 text-sm py-2 px-1 focus:outline-none focus:border-primary placeholder:text-slate-400 dark:placeholder:text-slate-600 resize-none h-10 transition-all focus:h-20" placeholder="Notas (ej. dolor de hombro, asiento #4...)"></textarea>
<span class="material-symbols-outlined absolute right-1 top-2 text-slate-400 text-sm pointer-events-none">edit_note</span>
</div>
</div>
<!-- Sets Header -->
<div class="grid grid-cols-12 gap-2 px-4 py-2 mt-2 text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider text-center">
<div class="col-span-2 text-left pl-2">Set</div>
<div class="col-span-3">Anterior</div>
<div class="col-span-3">kg</div>
<div class="col-span-3">Reps</div>
<div class="col-span-1"></div>
</div>
<!-- Sets List -->
<div class="flex flex-col gap-3 px-4">
<!-- Set 1 (Completed) -->
<div class="group relative flex items-center bg-primary/10 dark:bg-primary/5 border border-primary/20 rounded-xl p-1 pr-2 transition-all">
<div class="grid grid-cols-12 gap-2 w-full items-center">
<div class="col-span-2 flex flex-col justify-center pl-3">
<span class="text-sm font-bold text-primary">1</span>
<span class="text-[10px] text-primary uppercase font-bold">Warmup</span>
</div>
<div class="col-span-3 text-center text-xs text-slate-500 dark:text-slate-400">
                        40kg x 15
                    </div>
<div class="col-span-3">
<input class="w-full text-center bg-transparent border-b border-transparent focus:border-primary focus:outline-none font-bold text-lg p-1 text-slate-400 dark:text-slate-500 pointer-events-none" readonly="" type="number" value="40"/>
</div>
<div class="col-span-3">
<input class="w-full text-center bg-transparent border-b border-transparent focus:border-primary focus:outline-none font-bold text-lg p-1 text-slate-400 dark:text-slate-500 pointer-events-none" readonly="" type="number" value="15"/>
</div>
<div class="col-span-1 flex justify-center">
<label class="checkbox-wrapper cursor-pointer relative flex items-center justify-center size-8">
<input checked="" class="opacity-0 absolute w-full h-full cursor-pointer z-10" disabled="" type="checkbox"/>
<div class="size-6 rounded bg-primary border-2 border-primary flex items-center justify-center transition-all">
<span class="material-symbols-outlined text-background-dark text-base font-bold opacity-100">check</span>
</div>
</label>
</div>
</div>
</div>
<!-- Set 2 (Active) -->
<div class="group relative flex items-center bg-surface-light dark:bg-surface-dark border-l-4 border-l-primary shadow-lg rounded-r-xl rounded-l-sm p-1 pr-2 transition-all transform scale-[1.02]">
<div class="grid grid-cols-12 gap-2 w-full items-center">
<div class="col-span-2 flex flex-col justify-center pl-3">
<span class="text-lg font-bold text-slate-900 dark:text-white">2</span>
</div>
<div class="col-span-3 text-center text-xs text-slate-500 dark:text-slate-400">
                        60kg x 12
                    </div>
<div class="col-span-3">
<input class="w-full text-center bg-slate-100 dark:bg-[#2A4034] rounded-lg focus:ring-2 focus:ring-primary focus:outline-none font-bold text-lg py-3 text-slate-900 dark:text-white placeholder:text-slate-400/50 dark:placeholder:text-slate-500" placeholder="60" type="number"/>
</div>
<div class="col-span-3">
<input class="w-full text-center bg-slate-100 dark:bg-[#2A4034] rounded-lg focus:ring-2 focus:ring-primary focus:outline-none font-bold text-lg py-3 text-slate-900 dark:text-white placeholder:text-slate-400/50 dark:placeholder:text-slate-500" placeholder="12" type="number"/>
</div>
<div class="col-span-1 flex justify-center">
<label class="checkbox-wrapper cursor-pointer relative flex items-center justify-center size-8">
<input class="opacity-0 absolute w-full h-full cursor-pointer z-10" type="checkbox"/>
<div class="size-8 rounded-lg bg-slate-200 dark:bg-slate-700 border-2 border-transparent hover:border-primary/50 flex items-center justify-center transition-all">
<span class="material-symbols-outlined text-white text-lg font-bold opacity-0 transition-opacity">check</span>
</div>
</label>
</div>
</div>
</div>
<!-- Set 3 (Future) -->
<div class="group relative flex items-center bg-surface-light dark:bg-surface-dark border border-slate-200 dark:border-slate-800 rounded-xl p-1 pr-2 opacity-80">
<div class="grid grid-cols-12 gap-2 w-full items-center">
<div class="col-span-2 flex flex-col justify-center pl-3">
<span class="text-sm font-bold text-slate-500 dark:text-slate-400">3</span>
</div>
<div class="col-span-3 text-center text-xs text-slate-500 dark:text-slate-400">
                        65kg x 10
                    </div>
<div class="col-span-3">
<input class="w-full text-center bg-transparent border-b border-slate-200 dark:border-slate-700 focus:border-primary focus:outline-none font-medium text-lg p-2 text-slate-900 dark:text-white placeholder:text-slate-300 dark:placeholder:text-slate-600" placeholder="65" type="number"/>
</div>
<div class="col-span-3">
<input class="w-full text-center bg-transparent border-b border-slate-200 dark:border-slate-700 focus:border-primary focus:outline-none font-medium text-lg p-2 text-slate-900 dark:text-white placeholder:text-slate-300 dark:placeholder:text-slate-600" placeholder="10" type="number"/>
</div>
<div class="col-span-1 flex justify-center">
<label class="checkbox-wrapper cursor-pointer relative flex items-center justify-center size-8">
<input class="opacity-0 absolute w-full h-full cursor-pointer z-10" type="checkbox"/>
<div class="size-6 rounded bg-slate-200 dark:bg-slate-700 border-2 border-transparent flex items-center justify-center transition-all">
<span class="material-symbols-outlined text-white text-sm font-bold opacity-0">check</span>
</div>
</label>
</div>
</div>
</div>
<!-- Set 4 (Future) -->
<div class="group relative flex items-center bg-surface-light dark:bg-surface-dark border border-slate-200 dark:border-slate-800 rounded-xl p-1 pr-2 opacity-60">
<div class="grid grid-cols-12 gap-2 w-full items-center">
<div class="col-span-2 flex flex-col justify-center pl-3">
<span class="text-sm font-bold text-slate-500 dark:text-slate-400">4</span>
</div>
<div class="col-span-3 text-center text-xs text-slate-500 dark:text-slate-400">
                        65kg x 10
                    </div>
<div class="col-span-3">
<input class="w-full text-center bg-transparent border-b border-slate-200 dark:border-slate-700 focus:border-primary focus:outline-none font-medium text-lg p-2 text-slate-900 dark:text-white placeholder:text-slate-300 dark:placeholder:text-slate-600" placeholder="-" type="number"/>
</div>
<div class="col-span-3">
<input class="w-full text-center bg-transparent border-b border-slate-200 dark:border-slate-700 focus:border-primary focus:outline-none font-medium text-lg p-2 text-slate-900 dark:text-white placeholder:text-slate-300 dark:placeholder:text-slate-600" placeholder="-" type="number"/>
</div>
<div class="col-span-1 flex justify-center">
<label class="checkbox-wrapper cursor-pointer relative flex items-center justify-center size-8">
<input class="opacity-0 absolute w-full h-full cursor-pointer z-10" type="checkbox"/>
<div class="size-6 rounded bg-slate-200 dark:bg-slate-700 border-2 border-transparent flex items-center justify-center transition-all">
<span class="material-symbols-outlined text-white text-sm font-bold opacity-0">check</span>
</div>
</label>
</div>
</div>
</div>
<!-- Add Set Button -->
<button class="mt-2 flex w-full items-center justify-center gap-2 rounded-xl border border-dashed border-slate-300 dark:border-slate-600 bg-transparent py-3 text-sm font-semibold text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-surface-dark transition-colors">
<span class="material-symbols-outlined text-lg">add</span>
                Añadir Set
            </button>
<div class="h-24"></div> <!-- Spacer for fixed footer -->
</div>
</main>
<!-- Rest Timer Overlay (Floating) -->
<div class="fixed bottom-[88px] left-4 right-4 z-20">
<div class="flex items-center justify-between bg-surface-dark/95 backdrop-blur-md border border-primary/20 rounded-full px-4 py-2 shadow-2xl">
<div class="flex items-center gap-3">
<div class="flex size-10 items-center justify-center rounded-full bg-primary/20 text-primary animate-pulse">
<span class="material-symbols-outlined text-xl">timer</span>
</div>
<div class="flex flex-col">
<span class="text-xs text-slate-400 font-medium uppercase tracking-wide">Descanso</span>
<span class="text-lg font-bold text-white font-mono leading-none">01:45</span>
</div>
</div>
<div class="flex items-center gap-1">
<button class="flex h-8 items-center rounded-full bg-surface-light/10 px-3 text-xs font-medium text-white hover:bg-white/20">
                    +30s
                </button>
<button class="flex size-8 items-center justify-center rounded-full bg-surface-light/10 text-white hover:bg-white/20">
<span class="material-symbols-outlined text-lg">skip_next</span>
</button>
</div>
</div>
</div>
<!-- Bottom Navigation Footer -->
<footer class="fixed bottom-0 left-0 right-0 z-30 border-t border-slate-200 dark:border-slate-800 bg-surface-light dark:bg-background-dark pb-safe">
<div class="flex items-center justify-between p-4 pb-8 md:pb-4 gap-4">
<button class="flex flex-1 items-center justify-center gap-2 rounded-xl bg-slate-200 dark:bg-surface-dark py-3.5 text-sm font-bold text-slate-700 dark:text-slate-200 hover:brightness-95 transition-all">
<span class="material-symbols-outlined">arrow_back</span>
<span class="hidden sm:inline">Anterior</span>
</button>
<button class="flex-[2] flex items-center justify-center gap-2 rounded-xl bg-primary py-3.5 text-sm font-bold text-background-dark shadow-[0_0_20px_-5px_#13ec80] hover:shadow-[0_0_25px_-5px_#13ec80] transition-all active:scale-[0.98]">
                Siguiente Ejercicio
                <span class="material-symbols-outlined">arrow_forward</span>
</button>
</div>
</footer>
</body></html>
