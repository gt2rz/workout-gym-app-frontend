<!DOCTYPE html>

<html class="dark" lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Mi Perfil - Fitness App</title>
<!-- Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&amp;family=Noto+Sans:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#13ec80",
                        "primary-dark": "#0fb863",
                        "background-light": "#f6f8f7",
                        "background-dark": "#102219",
                        "surface-dark": "#1a2c22",
                        "surface-light": "#ffffff",
                    },
                    fontFamily: {
                        "display": ["Lexend", "sans-serif"],
                        "body": ["Noto Sans", "sans-serif"],
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-white font-display antialiased selection:bg-primary selection:text-background-dark">
<div class="relative flex min-h-screen flex-col overflow-hidden pb-24">
<!-- Header -->
<header class="flex items-center justify-between px-4 py-4 pt-8 sticky top-0 z-10 bg-background-light/90 dark:bg-background-dark/90 backdrop-blur-md">
<h1 class="text-xl font-bold tracking-tight">Mi Perfil</h1>
<button aria-label="Settings" class="flex h-10 w-10 items-center justify-center rounded-full bg-transparent hover:bg-black/5 dark:hover:bg-white/10 transition-colors">
<span class="material-symbols-outlined">settings</span>
</button>
</header>
<!-- Profile Section -->
<section class="flex flex-col items-center px-4 pt-2 pb-6">
<div class="relative mb-4 group cursor-pointer">
<div class="h-28 w-28 rounded-full border-4 border-primary p-1">
<div class="h-full w-full rounded-full bg-cover bg-center" data-alt="Portrait of a fitness enthusiast man in a gym setting" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuDBCYt1f_c7OXAzsx2xehotLbVoTzLu3HjnKCTxwilu-_qHG_01sbYiZttl2C7_KN5NruNx2ZjdH5hAMrMgqKAUeAlnR5L_1pYsXoog24DRE4DRyVDqn5fl3lkAIpUzXP9nhoXzx5W0THcfaPRITZgibrOwlWOgv1C96MPZ9oRXb0mv-Ze2lCgBBZ2Oqlf5u1Q1lYt0k14_7b31Jz4kpenu5ujxUGorC-zIdJNuANbR6T1KRX3BdpnVJdVPgGUu3aD6rGKGQI-XRFU');"></div>
</div>
<div class="absolute bottom-0 right-0 flex h-8 w-8 items-center justify-center rounded-full bg-primary text-background-dark ring-2 ring-background-dark">
<span class="material-symbols-outlined text-lg">edit</span>
</div>
</div>
<h2 class="text-2xl font-bold">Alex Martinez</h2>
<div class="mt-1 flex items-center gap-1 rounded-full bg-primary/10 px-3 py-1">
<span class="material-symbols-outlined text-[16px] text-primary">verified</span>
<span class="text-sm font-medium text-primary">Pro Member</span>
</div>
</section>
<!-- Quick Stats Grid -->
<section class="px-4 pb-6">
<div class="grid grid-cols-2 gap-3">
<!-- Stat Card 1 -->
<div class="flex flex-col gap-1 rounded-xl bg-surface-light dark:bg-surface-dark p-4 shadow-sm">
<div class="flex items-center gap-2 text-slate-500 dark:text-slate-400">
<span class="material-symbols-outlined text-xl">fitness_center</span>
<span class="text-xs font-medium uppercase tracking-wider">Total</span>
</div>
<p class="text-2xl font-bold text-slate-900 dark:text-white">124</p>
<p class="text-xs text-slate-500 dark:text-slate-400">Entrenamientos</p>
</div>
<!-- Stat Card 2 -->
<div class="flex flex-col gap-1 rounded-xl bg-surface-light dark:bg-surface-dark p-4 shadow-sm">
<div class="flex items-center gap-2 text-slate-500 dark:text-slate-400">
<span class="material-symbols-outlined text-xl">timer</span>
<span class="text-xs font-medium uppercase tracking-wider">Tiempo</span>
</div>
<p class="text-2xl font-bold text-slate-900 dark:text-white">86</p>
<p class="text-xs text-slate-500 dark:text-slate-400">Horas Totales</p>
</div>
<!-- Stat Card 3 -->
<div class="flex flex-col gap-1 rounded-xl bg-surface-light dark:bg-surface-dark p-4 shadow-sm">
<div class="flex items-center gap-2 text-primary">
<span class="material-symbols-outlined text-xl">local_fire_department</span>
<span class="text-xs font-medium uppercase tracking-wider">Racha</span>
</div>
<p class="text-2xl font-bold text-primary">5 días</p>
<p class="text-xs text-slate-500 dark:text-slate-400">Sigue así</p>
</div>
<!-- Stat Card 4 -->
<div class="flex flex-col gap-1 rounded-xl bg-surface-light dark:bg-surface-dark p-4 shadow-sm">
<div class="flex items-center gap-2 text-slate-500 dark:text-slate-400">
<span class="material-symbols-outlined text-xl">monitor_weight</span>
<span class="text-xs font-medium uppercase tracking-wider">Peso</span>
</div>
<p class="text-2xl font-bold text-slate-900 dark:text-white">75.5 <span class="text-sm font-normal text-slate-500">kg</span></p>
<p class="text-xs text-primary">+0.5kg este mes</p>
</div>
</div>
</section>
<!-- Progress Chart Section -->
<section class="px-4 pb-6">
<div class="rounded-xl bg-surface-light dark:bg-surface-dark p-5 shadow-sm">
<div class="mb-4 flex items-center justify-between">
<h3 class="font-bold text-lg">Progreso de Peso</h3>
<button class="text-xs font-medium text-primary hover:text-primary-dark">Ver Todo</button>
</div>
<!-- Simple SVG Chart Representation -->
<div class="relative h-32 w-full">
<!-- Grid Lines -->
<div class="absolute inset-0 flex flex-col justify-between text-[10px] text-slate-500">
<div class="border-b border-dashed border-slate-200 dark:border-slate-700 pb-1">78kg</div>
<div class="border-b border-dashed border-slate-200 dark:border-slate-700 pb-1">76kg</div>
<div class="border-b border-dashed border-slate-200 dark:border-slate-700 pb-1">74kg</div>
</div>
<!-- Chart Line (SVG) -->
<svg class="absolute inset-0 h-full w-full pt-4" preserveaspectratio="none" viewbox="0 0 100 50">
<defs>
<lineargradient id="gradient" x1="0" x2="0" y1="0" y2="1">
<stop offset="0%" stop-color="#13ec80" stop-opacity="0.5"></stop>
<stop offset="100%" stop-color="#13ec80" stop-opacity="0"></stop>
</lineargradient>
</defs>
<path d="M0,40 Q20,35 40,25 T100,20" fill="none" stroke="#13ec80" stroke-linecap="round" stroke-width="3"></path>
<path d="M0,40 Q20,35 40,25 T100,20 V50 H0 Z" fill="url(#gradient)" stroke="none"></path>
<!-- Data Points -->
<circle cx="0" cy="40" fill="#13ec80" r="2"></circle>
<circle cx="40" cy="25" fill="#13ec80" r="2"></circle>
<circle class="fill-white dark:fill-background-dark stroke-primary" cx="100" cy="20" r="2" stroke-width="2"></circle>
</svg>
</div>
</div>
</section>
<!-- Menu Actions -->
<section class="px-4 pb-8">
<div class="flex flex-col gap-1 rounded-xl bg-surface-light dark:bg-surface-dark overflow-hidden shadow-sm">
<button class="flex w-full items-center justify-between p-4 hover:bg-black/5 dark:hover:bg-white/5 transition-colors group">
<div class="flex items-center gap-3">
<div class="flex h-10 w-10 items-center justify-center rounded-lg bg-blue-500/10 text-blue-500">
<span class="material-symbols-outlined">person</span>
</div>
<span class="font-medium">Editar Perfil</span>
</div>
<span class="material-symbols-outlined text-slate-400 group-hover:text-white transition-colors">chevron_right</span>
</button>
<div class="h-[1px] w-full bg-slate-200 dark:bg-slate-700/50 ml-16"></div>
<button class="flex w-full items-center justify-between p-4 hover:bg-black/5 dark:hover:bg-white/5 transition-colors group">
<div class="flex items-center gap-3">
<div class="flex h-10 w-10 items-center justify-center rounded-lg bg-purple-500/10 text-purple-500">
<span class="material-symbols-outlined">flag</span>
</div>
<span class="font-medium">Objetivos</span>
</div>
<span class="material-symbols-outlined text-slate-400 group-hover:text-white transition-colors">chevron_right</span>
</button>
<div class="h-[1px] w-full bg-slate-200 dark:bg-slate-700/50 ml-16"></div>
<button class="flex w-full items-center justify-between p-4 hover:bg-black/5 dark:hover:bg-white/5 transition-colors group">
<div class="flex items-center gap-3">
<div class="flex h-10 w-10 items-center justify-center rounded-lg bg-orange-500/10 text-orange-500">
<span class="material-symbols-outlined">history</span>
</div>
<span class="font-medium">Historial de Rutinas</span>
</div>
<span class="material-symbols-outlined text-slate-400 group-hover:text-white transition-colors">chevron_right</span>
</button>
</div>
<button class="mt-6 w-full py-4 text-center text-red-500 font-medium hover:text-red-400 transition-colors">
                Cerrar Sesión
            </button>
</section>
</div>
<!-- Bottom Navigation Bar (iOS Style) -->
<div class="fixed bottom-0 left-0 right-0 z-50 border-t border-slate-200 dark:border-white/10 bg-background-light/95 dark:bg-background-dark/95 backdrop-blur-lg pb-6 pt-2">
<div class="flex justify-around items-center">
<button class="flex flex-col items-center gap-1 p-2 text-slate-400 hover:text-primary transition-colors">
<span class="material-symbols-outlined filled">home</span>
<span class="text-[10px] font-medium">Inicio</span>
</button>
<button class="flex flex-col items-center gap-1 p-2 text-slate-400 hover:text-primary transition-colors">
<span class="material-symbols-outlined">fitness_center</span>
<span class="text-[10px] font-medium">Rutinas</span>
</button>
<button class="flex flex-col items-center gap-1 p-2 -mt-6">
<div class="flex h-14 w-14 items-center justify-center rounded-full bg-primary text-background-dark shadow-lg shadow-primary/40">
<span class="material-symbols-outlined text-3xl">add</span>
</div>
</button>
<button class="flex flex-col items-center gap-1 p-2 text-slate-400 hover:text-primary transition-colors">
<span class="material-symbols-outlined">insights</span>
<span class="text-[10px] font-medium">Stats</span>
</button>
<button class="flex flex-col items-center gap-1 p-2 text-primary">
<span class="material-symbols-outlined filled">person</span>
<span class="text-[10px] font-medium">Perfil</span>
</button>
</div>
</div>
</body></html>
