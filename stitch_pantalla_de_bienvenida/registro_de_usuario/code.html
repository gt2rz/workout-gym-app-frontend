<!DOCTYPE html>

<html class="dark" lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Registro de Usuario - Fitness App</title>
<!-- Google Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Tailwind Config -->
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#13ec80",
              "primary-dark": "#0fb360",
              "background-light": "#f6f8f7",
              "background-dark": "#102219",
              "surface-dark": "#193326",
              "text-secondary": "#92c9ad",
            },
            fontFamily: {
              "display": ["Lexend", "sans-serif"]
            },
            borderRadius: {"DEFAULT": "0.5rem", "lg": "0.75rem", "xl": "1rem", "full": "9999px"},
            boxShadow: {
                'neon': '0 0 10px rgba(19, 236, 128, 0.4), 0 0 20px rgba(19, 236, 128, 0.2)',
            }
          },
        },
      }
    </script>
<style>
        /* Custom scrollbar for better mobile feel if needed */
        ::-webkit-scrollbar {
            width: 0px;
            background: transparent;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display min-h-screen flex items-center justify-center p-0">
<div class="relative w-full max-w-md mx-auto h-full min-h-screen flex flex-col bg-background-light dark:bg-background-dark overflow-hidden">
<!-- Background decorative element -->
<div class="absolute top-0 right-0 w-64 h-64 bg-primary/10 rounded-full blur-3xl -translate-y-1/2 translate-x-1/2 pointer-events-none"></div>
<!-- Top Bar (Back button) -->
<div class="relative z-10 flex items-center p-4">
<button class="flex items-center justify-center w-10 h-10 rounded-full bg-surface-dark/50 hover:bg-surface-dark transition-colors text-white">
<span class="material-symbols-outlined">arrow_back_ios_new</span>
</button>
</div>
<!-- Header Section -->
<div class="relative z-10 px-6 pt-2 pb-6 flex flex-col items-center text-center">
<!-- App Logo / Icon -->
<div class="mb-6 p-4 rounded-full bg-surface-dark border border-primary/20 shadow-neon">
<span class="material-symbols-outlined text-primary text-4xl">fitness_center</span>
</div>
<h1 class="text-gray-900 dark:text-white tracking-tight text-3xl font-bold leading-tight mb-2">
                Empieza tu <br/><span class="text-primary">Transformación</span>
</h1>
<p class="text-gray-600 dark:text-text-secondary text-base font-normal leading-relaxed max-w-xs">
                Registra entrenamientos, monitorea tu peso y rompe tus metas.
            </p>
</div>
<!-- Form Section -->
<div class="flex-1 px-6 flex flex-col gap-4 relative z-10">
<!-- Full Name -->
<div class="group">
<label class="block text-gray-700 dark:text-white text-sm font-medium mb-2 pl-1">Nombre Completo</label>
<div class="relative flex items-center">
<input class="w-full bg-white dark:bg-surface-dark border border-gray-300 dark:border-[#32674d] text-gray-900 dark:text-white text-base rounded-lg focus:ring-1 focus:ring-primary focus:border-primary block p-4 pr-12 placeholder-gray-400 dark:placeholder-text-secondary/50 transition-all shadow-sm" placeholder="Juan Pérez" type="text"/>
<div class="absolute right-4 text-gray-400 dark:text-text-secondary flex items-center pointer-events-none">
<span class="material-symbols-outlined">person</span>
</div>
</div>
</div>
<!-- Email -->
<div class="group">
<label class="block text-gray-700 dark:text-white text-sm font-medium mb-2 pl-1">Correo Electrónico</label>
<div class="relative flex items-center">
<input class="w-full bg-white dark:bg-surface-dark border border-gray-300 dark:border-[#32674d] text-gray-900 dark:text-white text-base rounded-lg focus:ring-1 focus:ring-primary focus:border-primary block p-4 pr-12 placeholder-gray-400 dark:placeholder-text-secondary/50 transition-all shadow-sm" placeholder="gymrat@ejemplo.com" type="email"/>
<div class="absolute right-4 text-gray-400 dark:text-text-secondary flex items-center pointer-events-none">
<span class="material-symbols-outlined">mail</span>
</div>
</div>
</div>
<!-- Password -->
<div class="group">
<label class="block text-gray-700 dark:text-white text-sm font-medium mb-2 pl-1">Contraseña</label>
<div class="relative flex items-center">
<input class="w-full bg-white dark:bg-surface-dark border border-gray-300 dark:border-[#32674d] text-gray-900 dark:text-white text-base rounded-lg focus:ring-1 focus:ring-primary focus:border-primary block p-4 pr-12 placeholder-gray-400 dark:placeholder-text-secondary/50 transition-all shadow-sm" placeholder="••••••••" type="password"/>
<button class="absolute right-4 text-gray-400 dark:text-text-secondary flex items-center hover:text-primary transition-colors focus:outline-none">
<span class="material-symbols-outlined">visibility</span>
</button>
</div>
</div>
<!-- Terms Checkbox -->
<div class="flex items-start mt-2">
<div class="flex items-center h-5">
<input class="w-5 h-5 border border-gray-300 rounded bg-gray-50 focus:ring-3 focus:ring-primary dark:bg-surface-dark dark:border-gray-600 dark:focus:ring-primary dark:ring-offset-gray-800 text-primary" id="terms" type="checkbox" value=""/>
</div>
<label class="ml-2 text-sm font-medium text-gray-500 dark:text-gray-400" for="terms">
                    Acepto los <a class="text-primary hover:underline" href="#">Términos</a> y la <a class="text-primary hover:underline" href="#">Política de Privacidad</a>.
                </label>
</div>
<!-- Submit Button -->
<button class="mt-4 w-full bg-primary hover:bg-primary-dark text-background-dark font-bold text-lg py-4 px-6 rounded-lg transition-all duration-200 transform active:scale-[0.98] shadow-[0_4px_14px_0_rgba(19,236,128,0.39)] hover:shadow-[0_6px_20px_rgba(19,236,128,0.23)] flex justify-center items-center gap-2">
                Crear Cuenta
                <span class="material-symbols-outlined text-xl font-bold">arrow_forward</span>
</button>
<!-- Divider -->
<div class="relative my-4">
<div class="absolute inset-0 flex items-center">
<div class="w-full border-t border-gray-300 dark:border-gray-700"></div>
</div>
<div class="relative flex justify-center text-sm">
<span class="px-2 bg-background-light dark:bg-background-dark text-gray-500 dark:text-gray-400">O continúa con</span>
</div>
</div>
<!-- Social Buttons -->
<div class="grid grid-cols-2 gap-4 mb-6">
<button class="flex items-center justify-center gap-2 w-full bg-white dark:bg-white text-gray-900 border border-gray-300 dark:border-transparent hover:bg-gray-50 font-medium py-3 px-4 rounded-lg transition-colors">
<img alt="Google Logo" class="w-5 h-5" data-alt="Google G logo" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBKIv5W7vToyGIQElP3tD6SMALgCXPlf1PRTipuzxcsWHg5EdDFHPaBhrUZgxEhePt3dbKSwneQ_Clm8H1-Bxf7XvNkQ4A_IicbnvsjHTV9svxKVq_NQAp-ZhUMWckfRlmT1zCoiO61RM3i5lp7vFE19VzZnbV73qmEHw9Zog__FtvcdVcco5YuOoh74nlmZGrSMgQ1w-tHEQogCFWkIF-2FzQJsJ01N7_wP0jD1QRrYX8HNZ9EeK_HSTrgB3hpdO9VrMJ5yM1T7DE"/>
<span>Google</span>
</button>
<button class="flex items-center justify-center gap-2 w-full bg-gray-900 dark:bg-[#2A2A2A] text-white border border-transparent hover:bg-gray-800 font-medium py-3 px-4 rounded-lg transition-colors">
<span class="material-symbols-outlined text-[22px]">ios</span>
<span>Apple</span>
</button>
</div>
<!-- Footer Link -->
<div class="pb-8 text-center">
<p class="text-sm text-gray-600 dark:text-gray-400">
                    ¿Ya tienes una cuenta? 
                    <a class="text-primary font-semibold hover:underline decoration-2 underline-offset-4" href="#">Inicia Sesión</a>
</p>
</div>
</div>
</div>
</body></html>
